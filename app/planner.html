<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFEAE0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191F" media="(prefers-color-scheme: dark)">
<meta name="description" content="DayScript: your day, in your own script. A planner you write in, with a quiet pencil in the margin.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 44A24 24 0 0 1 56 44' fill='none' stroke='%23B5713D' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='42' r='9' fill='%23B5713D'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DayScript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Karla:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500&display=swap">
<style>
/* Layout: one paper page on a warm ground, month tabs as a copper-and-taupe rail on its right edge (a strip on phones); pencil marks live in a narrow margin column. */
:root{
  --ground:#EFEAE0; --paper:#F7F3EA; --sheet:#FDFBF5; --ink:#26324B; --copper:#B5713D;
  --copper-soft:#E8D3C1; --sage:#DFE6DC; --taupe:#E9E2D3; --label:#7A7466; --rule:#DCD5C5; --pencil:#6E6A62;
  --faint:var(--faint); --rule2:var(--rule2); --shadow:var(--shadow);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#17191F; --paper:#21242C; --sheet:#282B34; --ink:#ECE6D9; --copper:#D4935C;
  --copper-soft:#4A3628; --sage:#29332D; --taupe:#2F313A; --label:#A49D8E; --rule:#3A3D47; --pencil:#BDB5A6;
  --faint:#6E6A61; --rule2:#55534D; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#17191F; --paper:#21242C; --sheet:#282B34; --ink:#ECE6D9; --copper:#D4935C;
  --copper-soft:#4A3628; --sage:#29332D; --taupe:#2F313A; --label:#A49D8E; --rule:#3A3D47; --pencil:#BDB5A6;
  --faint:#6E6A61; --rule2:#55534D; --shadow:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:3px}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--body);font-weight:700;letter-spacing:.24em;font-size:11px;color:var(--label);margin-right:auto;background:none;border:0;padding:6px 0}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--taupe);border:0;border-radius:99px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.pill[aria-current="true"]{background:var(--copper);color:var(--paper)}
.pill.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--label)}
.pill.ghost[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--copper);color:var(--copper)}

/* book */
.book{display:flex;gap:6px;align-items:flex-start}
.page{flex:1;min-width:0;background:var(--paper);border-radius:4px;box-shadow:0 1px 0 var(--rule),0 18px 40px -28px var(--shadow);
  padding:clamp(18px,4vw,44px);position:relative;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:28px}
.page.wide{grid-template-columns:minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:5px;padding-top:30px}
.tab{writing-mode:vertical-rl;background:var(--taupe);border:0;border-radius:0 5px 5px 0;padding:12px 7px;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--label)}
.tab[aria-current="true"]{background:var(--copper);color:var(--paper)}
@media (max-width:880px){
  .book{flex-direction:column-reverse;align-items:stretch}
  .rail{flex-direction:row;overflow-x:auto;padding:0 0 2px}
  .tab{writing-mode:horizontal-tb;border-radius:5px 5px 0 0;padding:7px 10px;flex:none}
  .page{grid-template-columns:minmax(0,1fr)}
  .margin{order:-1}
}

/* type */
h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(28px,4vw,38px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:20px;margin:0}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.voice{font-family:var(--display);font-style:italic;color:var(--label)}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nav{display:flex;gap:6px;margin-left:auto}
.arrow{background:none;border:1px solid var(--rule);border-radius:99px;width:32px;height:32px;color:var(--copper);font-size:16px;line-height:1}
.num{font-family:var(--display);font-weight:600;color:var(--copper);font-variant-numeric:tabular-nums}

/* writing lines */
.line{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);min-height:38px}
.line input[type=text],.field{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:8px 0;font-size:15px}
.field.under{border-bottom:1px solid var(--copper);border-radius:0}
.line input::placeholder,.field::placeholder{color:var(--faint);font-style:italic}
.box{appearance:none;width:16px;height:16px;border:1.3px solid var(--copper);border-radius:2px;flex:none;margin:0;display:grid;place-content:center;background:transparent}
.box:checked::after{content:"";width:9px;height:9px;background:var(--copper);clip-path:polygon(14% 52%,0 66%,40% 100%,100% 20%,86% 6%,40% 72%)}
.done input[type=text]{text-decoration:line-through;text-decoration-color:var(--copper);color:var(--label)}
.x{background:none;border:0;color:var(--faint);font-size:15px;padding:4px 6px}
.x:hover{color:var(--copper)}
.sage{background:var(--sage);border-radius:6px;padding:14px 16px}
.cardp{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.btn.copper{background:var(--copper)}
.btn.line-btn{background:transparent;color:var(--copper);box-shadow:inset 0 0 0 1px var(--copper)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}

/* margin / pencil marks */
.margin{display:flex;flex-direction:column;gap:14px;padding-top:4px;min-width:0}
.mark{font-family:var(--hand);font-size:22px;line-height:1.1;color:var(--pencil);transform:rotate(-1.6deg);display:flex;flex-direction:column;gap:4px;
  border-left:1.5px solid var(--rule2);padding-left:10px}
.mark .acts{display:flex;gap:10px;font-family:var(--body);font-size:11px;letter-spacing:.06em}
.mark button{background:none;border:0;padding:2px 0;color:var(--copper);font-weight:700;text-transform:uppercase}
.mark button.no{color:var(--faint)}
.margin .quiet{font-family:var(--hand);font-size:19px;color:var(--faint)}

/* cover */
.cover{border:1.5px solid var(--copper);outline:1px solid var(--copper);outline-offset:-9px;padding:clamp(28px,6vw,64px) clamp(18px,5vw,56px);display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.wordmark{font-family:var(--display);font-weight:700;font-size:clamp(46px,9vw,76px);line-height:1;margin:0;color:var(--ink)}
.tagline{font-size:11.5px;font-weight:700;letter-spacing:.3em;color:var(--copper);text-transform:uppercase}
.toc{width:100%;max-width:560px;text-align:left;display:flex;flex-direction:column}
.toc button{display:flex;align-items:baseline;gap:14px;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 2px;text-align:left}
.toc .t{font-family:var(--display);font-style:italic;font-size:19px}
.toc .s{margin-left:auto;font-style:italic;color:var(--label);font-size:13px}
@media (max-width:520px){.toc .s{display:none}}

/* calendars */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--label);text-transform:uppercase;padding:2px 4px}
.cal button{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;min-height:56px;padding:5px 6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:15px}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--copper)}
.cal .dot{width:6px;height:6px;border-radius:50%;background:var(--copper)}
.cal .blank{visibility:hidden}
.years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 22px}
@media (max-width:640px){.years{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{background:none;border:0;padding:0;text-align:left}
.mini .mname{font-family:var(--display);font-style:italic;font-size:15px;margin-bottom:4px}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:10px;font-variant-numeric:tabular-nums;color:var(--ink)}
.mini .g span{text-align:center;padding:1px 0;border-radius:2px}
.mini .g .w{background:var(--copper-soft)}
.mini .g .t{background:var(--copper);color:var(--paper)}

/* rhythms */
.rh{overflow-x:auto}
.rh table{border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.rh th{font-weight:400;color:var(--label);padding:2px;text-align:center;min-width:16px}
.rh th.hn{text-align:left;padding-right:10px;font-family:var(--display);font-style:italic;font-size:13px;color:var(--ink);min-width:70px}
.rh td{padding:2px;text-align:center}
.rh .d{width:13px;height:13px;border-radius:50%;border:1px solid var(--rule);background:transparent;padding:0;display:block;margin:auto}
.rh .d.on{background:var(--copper);border-color:var(--copper)}

/* week */
.wk{display:flex;flex-direction:column}
.wkrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:14px;align-items:center;border-bottom:1px solid var(--rule);padding:10px 0;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.wkrow .dn{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.wkrow .dd{font-family:var(--display);font-weight:600;font-size:22px}
.wkrow .prev{color:var(--ink);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkrow .prev em{color:var(--faint)}
.wkrow.today .dd{color:var(--copper)}
.hd{display:flex;gap:3px}
.hd i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.hd i.on{background:var(--copper)}

/* day */
.dayhead .big{font-family:var(--display);font-weight:600;font-size:52px;line-height:.9;color:var(--copper)}
.dayhead .mo{font-family:var(--display);font-style:italic;font-size:22px;background:none;border:0;padding:0}
.paper{position:relative}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none;z-index:4}
.ink.on{pointer-events:auto;cursor:crosshair}
.penbar{position:relative;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--rule)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.habits{display:flex;gap:8px;flex-wrap:wrap}
.hb{display:flex;align-items:center;gap:6px;background:var(--taupe);border:0;border-radius:99px;padding:5px 11px 5px 7px;font-size:12.5px}
.hb i{width:12px;height:12px;border-radius:50%;border:1.3px solid var(--copper)}
.hb.on i{background:var(--copper)}
.suggest{position:relative;background:var(--sheet);border:1px solid var(--copper-soft);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.suggest label{display:flex;gap:10px;align-items:center;font-size:14px;padding:4px 0}

/* clearing / archive */
.circle{width:20px;height:20px;border-radius:50%;border:1.3px dashed var(--faint);background:transparent;flex:none;padding:0}
.circle.on{border:1.8px solid var(--copper);background:var(--copper-soft)}
.route{background:none;border:0;color:var(--copper);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.amt{width:90px;flex:none;text-align:right;font-variant-numeric:tabular-nums;border:0;background:transparent;padding:8px 0}
.total{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

/* method */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:12px 0;border-bottom:1px solid var(--rule)}
.step h3{font-family:var(--display);font-style:italic;font-weight:600;font-size:17px;margin:0 0 2px}
.step p{margin:0;max-width:62ch}

/* try-this guide */
.try{width:100%;max-width:560px;background:var(--sage);border-radius:8px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:4px}
.try button{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:baseline;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 0;text-align:left}
.try button:last-child{border-bottom:0}
.try .go{color:var(--copper);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* times & coming up */
.time{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--copper);background:var(--copper-soft);border-radius:99px;padding:2px 8px;font-variant-numeric:tabular-nums}
.up{display:flex;flex-direction:column}
.up button{display:grid;grid-template-columns:62px 56px minmax(0,1fr);gap:8px;align-items:baseline;background:none;border:0;border-bottom:1px solid var(--rule);padding:8px 0;text-align:left;font-size:13.5px}
.up .wd{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
.up .tm{color:var(--copper);font-weight:700;font-variant-numeric:tabular-nums}
.up .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* search */
.search{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:99px;padding:0 12px;box-shadow:inset 0 0 0 1px var(--rule);min-width:0;flex:0 1 220px}
.search input{border:0;background:transparent;padding:6px 0;font-size:13px;min-width:0;width:100%}
.search svg{flex:none;color:var(--label)}
.hits{display:flex;flex-direction:column}
.hits button{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:baseline;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 0;text-align:left}
.hits .where{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
.hits mark{background:var(--copper-soft);color:inherit;border-radius:2px;padding:0 1px}
@media (max-width:520px){.hits button{grid-template-columns:minmax(0,1fr)}}

/* re-read */
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tally>div{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.tally .n{font-family:var(--display);font-weight:600;font-size:24px;color:var(--copper);font-variant-numeric:tabular-nums}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--hand);font-size:22px;color:var(--pencil)}
.quote{border-left:2px solid var(--copper);padding:2px 0 2px 12px;font-family:var(--display);font-style:italic}

/* to-do rows: typed or handwritten */
.addbar{display:flex;gap:4px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.addbar button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:10px 10px 10px 0;color:var(--faint);font-style:italic;font-size:14px}
.addbar button:hover{color:var(--copper)}
.addbar button+button{padding-left:10px;border-left:1px solid var(--rule)}
.inkrow{min-height:48px}
.strip{flex:1;min-width:0;height:44px;display:block;touch-action:none;cursor:crosshair;border-radius:3px}
.inkrow:not(.done) .strip{background-image:linear-gradient(var(--copper-soft),var(--copper-soft));background-size:100% 1px;background-position:0 78%;background-repeat:no-repeat}
.x[disabled]{opacity:.35;cursor:default}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start}
.listname{font-family:var(--display);font-style:italic;font-weight:600;font-size:20px;padding:4px 0}

/* to-do button + sheet */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;
  background:var(--copper);color:var(--paper);border:0;border-radius:99px;padding:12px 18px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 10px 24px -10px var(--shadow)}
.fab.open{background:var(--ink)}
.fab .count{background:var(--paper);color:var(--copper);border-radius:99px;min-width:20px;padding:1px 6px;font-size:11px;letter-spacing:0;text-align:center}
.sheet{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:29;width:min(420px,calc(100vw - 36px));max-height:min(70vh,640px);overflow-y:auto;
  background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 20px 16px;display:flex;flex-direction:column;box-shadow:0 24px 50px -20px var(--shadow)}
@media (max-width:520px){.sheet{left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));width:auto}}
.line input[type=text]{transition:color .2s}
.done input[type=text]{text-decoration-thickness:1.5px}

.foot{text-align:center;font-family:var(--display);font-style:italic;color:var(--label);font-size:14px;padding-top:4px}
.note{font-size:12px;color:var(--label);text-align:center}
.confirm{display:inline-flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" data-act="view" data-v="cover">DAYSCRIPT</button>
    <label class="search"><svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.7 8.7 12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="find on any page" aria-label="Search the planner"></label>
    <nav class="pills" id="pills" aria-label="Sections"></nav>
  </header>
  <div class="book">
    <main class="page" id="page"></main>
    <nav class="rail" id="rail" aria-label="Months"></nav>
  </div>
  <p class="foot" id="smile"></p>
  <div id="sheet"></div>
  <p class="note">A working prototype. Pages save in this browser only. The sample entries are examples; "start fresh" on the cover clears them.</p>
</div>

<script>
(function(){
"use strict";
var KEY="dayscript.demo.v1";
var MFULL=["january","february","march","april","may","june","july","august","september","october","november","december"];
var MAB=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
var WD=["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
var START=new Date(2026,7,1), END=new Date(2027,6,31);

function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function add(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function wdi(s){return (parse(s).getDay()+6)%7}
function mon(s){return add(s,-wdi(s))}
function ymOf(s){return s.slice(0,7)}
function clampDay(s){var d=parse(s);if(d<START)return iso(START);if(d>END)return iso(END);return s}

var DAYRX=/\b(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)[a-z]*\.?\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i;

var DSHORT=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function capture(line,from){
  var m=DAYRX.exec(line);if(!m)return null;
  var di=DIDX[m[1].toLowerCase()];var h=+m[2];if(h>12)return null;
  var ap=m[4]?m[4].toLowerCase():(h<8||h===12?"pm":(h<12?"am":"pm"));if(!m[4]&&h>=1&&h<=7)ap="pm";
  var diff=(di-wdi(from)+7)%7;if(diff===0)diff=7;var target=add(from,diff);
  var when=h+(m[3]?":"+m[3]:"")+ap;
  var rest=(line.slice(0,m.index)+line.slice(m.index+m[0].length)).replace(/\s+/g," ").trim()||"appointment";
  return{target:target,label:DSHORT[di]+" "+when+"?",text:when+" · "+rest};
}
function marks(){

  function push(id,text,accept){if(S.dismissed.indexOf(id)<0)out.push({id:id,text:text,accept:accept})}
  if(v==="day"){
    var d=day(c);
    d.lines.forEach(function(l,i){if(l.done)return;var cp=capture(l.t,c);if(cp)push("cap:"+c+":"+l.t,cp.label,function(){
      day(cp.target).lines.push({t:cp.text,done:false});d.lines.splice(i,1);toast("filed on "+fmtShort(cp.target))})});
    var yl=(S.days[add(c,-1)]||{lines:[]}).lines.filter(function(l){return (l.t||(l.ink&&l.ink.length))&&!l.done});
    if(yl.length)push("carry:"+c,yl.length+" left from yesterday. carry "+(yl.length>1?"them":"it")+"?",function(){yl.forEach(function(l){d.lines.push(l.ink?{t:"",done:false,ink:JSON.parse(JSON.stringify(l.ink))}:{t:l.t,done:false});l.done=true})});
    if(!d.plot&&d.lines.filter(function(l){return l.t}).length>=2)push("plot:"+c,"what does today turn on?");
  }else if(v==="week"){
    var w=mon(c),wk=week(w);
    if(!wk.willdo.some(function(x){return x.t}))push("three:"+w,"this week's three?");
    var best=null,bn=0;for(var i=0;i<7;i++){var dd=add(w,i),n=(S.days[dd]||{lines:[]}).lines.filter(function(l){return l.t}).length;if(n>bn){bn=n;best=dd}}
    if(best&&bn>=3)push("full:"+w,"fullest day: "+DSHORT[wdi(best)].toLowerCase()+" ("+bn+")");
    if(!wk.win&&wdi(TODAY)>=4&&mon(TODAY)===w)push("win:"+w,"win of the week?");
  }else if(v==="month"){
    var k=ymOf(c),mo=month(k);

    year().stories.forEach(function(s,i){if(s.end&&!s.ch.some(function(x){return x.t}))push("noch:"+i,"an ending with no chapters yet")});
    if(year().stories.some(function(s){return !s.end}))push("noend","one more ending?");
  }else if(v==="clearing"){
    var un=S.clearing.filter(function(x){return !x.real}).length,cr=S.clearing.filter(function(x){return x.real}).length;
    if(un>=5)push("cir:"+un,"circle what's real");

  }

}

/* ---------- suggestions (local rules) ---------- */

  week(mon(c)).willdo.forEach(function(l){if(l.t&&!l.done)add1(l.t)});
  var g=month(ymOf(c)).goal;if(g)add1("one small step toward: "+g);
  for(var i=1;i<=3;i++){var x=S.days[add(c,i)];if(x)x.lines.forEach(function(l){if(l.t&&!l.done)add1("get ready for "+fmtShort(add(c,i))+": "+l.t.replace(/^.*?·\s*/,""))})}
